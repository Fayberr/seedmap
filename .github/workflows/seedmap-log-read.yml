name: Temporary Minecraft item-atlas bytecode inspection

on:
  push:
    branches:
      - ui/seedmap-overhaul
    paths:
      - .github/workflows/seedmap-log-read.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava --no-daemon --console=plain
      - name: Inspect Minecraft 26.3 bytecode
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, subprocess
          targets = {
              'net/minecraft/client/gui/render/GuiItemAtlas.class': '<init>',
              'net/minecraft/client/gui/render/pip/PictureInPictureRenderer.class': 'prepareTexturesAndProjection',
          }
          roots=[pathlib.Path('.gradle'),pathlib.Path.home()/'.gradle/caches']
          jars=[]
          for root in roots:
              if root.exists():
                  jars.extend(root.rglob('*.jar'))
          print('Found jars:',len(jars),flush=True)
          found=set()
          for jar in jars:
              if len(found)==len(targets):break
              try:
                  with zipfile.ZipFile(jar) as archive:
                      match=set(targets).intersection(archive.namelist())-found
                  if not match:continue
                  print('MATCH:',jar,match,flush=True)
                  for cls in match:
                      cname=cls[:-6].replace('/','.')
                      p=subprocess.run(['javap','-classpath',str(jar),'-c','-p',cname],
                           text=True,capture_output=True)
                      print('JAVAP EXIT:',p.returncode,flush=True)
                      if p.returncode: print(p.stderr[:3000]);continue
                      lines=p.stdout.splitlines()
                      start=next((i for i,l in enumerate(lines) if
                          ('public net.minecraft.client.gui.render.GuiItemAtlas(' in l
                           if 'GuiItemAtlas' in cname else 'private void prepareTexturesAndProjection(' in l)),None)
                      if start is None:
                          print('NO METHOD:',p.stdout[:3000]);continue
                      end=next((i for i in range(start+1,len(lines))
                          if lines[i].startswith('  ') and not lines[i].startswith('    ')
                          and not lines[i].startswith('       ')
                          and '(' in lines[i]),len(lines))
                      print('\n'.join(lines[start:min(end,start+165)]),flush=True)
                      found.add(cls)
              except Exception as e:
                  print('ERROR:',str(e)[:100])
          print('FOUND:',found,flush=True)
          PY
