name: Client smoke test

on:
  push:
    branches: ['fabric/26.3']
    paths:
      - 'src/main/**'
      - 'gradle.properties'
      - 'build.gradle'
      - '.github/workflows/client-smoke.yml'
  workflow_dispatch:

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Boot Minecraft under Xvfb
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=10s 150s \
            xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset" \
            env LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe MESA_GL_VERSION_OVERRIDE=4.6 \
            ./gradlew runClient --no-daemon --console=plain > client-smoke.log 2>&1
          exit_code=$?
          set -e
          tail -n 120 client-smoke.log
          if ! grep -Fq "SeedMap loaded" client-smoke.log; then
            echo "SeedMap did not initialize."
            exit 1
          fi
          if grep -Eq 'InvalidInjectionException|NoClassDefFoundError|NoSuchMethodError|Crash Report|Exception in thread "Render thread"|Failed to create backend|BackendCreationException|Couldn.t find matching GLX visual' client-smoke.log; then
            echo "Minecraft reported a startup error."
            exit 1
          fi
          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 124 ]; then
            echo "Minecraft exited unexpectedly: $exit_code"
            exit "$exit_code"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-smoke-log
          path: client-smoke.log
          if-no-files-found: ignore
