name: SeedMap log diagnostics (temporary)

on:
  push:
    branches: ['ui/seedmap-overhaul']
    paths:
      - '.github/workflows/seedmap-log-diagnostics.yml'

permissions:
  contents: read

jobs:
  inspect-public-log:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read SeedMap-only diagnostics from user-provided public mclogs link
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 35 \
            'https://api.mclo.gs/1/raw/yh9mthY' -o /tmp/seedmap-user-log.txt
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/seedmap-user-log.txt').read_text(errors='replace').splitlines()
          matches = [(i+1,line) for i,line in enumerate(lines)
                     if ('seedmap outline' in line.lower() or 'item silhouette' in line.lower()
                         or 'seedmap loaded' in line.lower()
                         or 'seedmap.mixin' in line.lower()
                         or 'capture item outline' in line.lower())]
          print(f'SeedMap diagnostics found: {len(matches)} in {len(lines)} lines')
          for number,line in matches[:150]:
              print(f'{number}: {line[:360]}')
          PY
